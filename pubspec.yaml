name: communal_collector
description: "Communal Collector — record cash contributions on the round."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.4
  intl: ^0.20.2
  google_fonts: ^6.3.2
  flutter_screenutil: ^5.9.3
  iconsax: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  connectivity_plus_platform_interface: ^2.0.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

# Same generator, same mark and same white ground as the member app, but the mark
# is inverted to black: the two apps sit next to each other in the drawer and the
# purple one is the member's. Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/launcher_icon_black.png"
  background_color_android: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/launcher_icon_foreground_black.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
